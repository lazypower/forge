name: forge verification

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "wi-v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: forge-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'lazypower/gitea-workload-identity'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the fork
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Enforce repository workflow policy
        run: contrib/workload-identity/ci/check-workflows.sh

      - name: Configure BuildKit
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Configure Go toolchain
        uses: ./.github/actions/go-setup
        with:
          lint-cache: "true"

      - name: Install pinned tools
        run: make deps-tools

      - name: Verify the fork and exact rootless image
        run: contrib/workload-identity/ci/verify-fork.sh
