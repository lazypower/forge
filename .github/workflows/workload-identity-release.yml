name: Forge release

on:
  push:
    tags:
      - "wi-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing verified wi-v tag to release
        required: true
        type: string

concurrency:
  group: forge-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  IMAGE_NAME: ghcr.io/lazypower/forge
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  release:
    if: github.repository == 'lazypower/forge'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tagged Forge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag
        run: |
          set -eu
          case "$RELEASE_TAG" in
            wi-v*) ;;
            *) echo "invalid release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac

      - name: Configure BuildKit
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Configure Gitea Go toolchain
        uses: ./.github/actions/go-setup
        with:
          lint-cache: "true"

      - name: Install pinned tools
        run: make deps-tools

      - name: Certify the Forge release image
        run: contrib/workload-identity/ci/verify-fork.sh

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the verified image
        id: publish
        run: |
          set -eu
          . ./verified-image.env
          . contrib/workload-identity/lineage.env
          release_ref="$IMAGE_NAME:$RELEASE_TAG"
          docker tag "$IMAGE_REF" "$release_ref"
          docker push "$release_ref"
          digest="$(docker buildx imagetools inspect "$release_ref" --format '{{.Manifest.Digest}}')"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'reference=%s\n' "$release_ref" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg release "$RELEASE_TAG" \
            --arg image "$IMAGE_NAME" \
            --arg digest "$digest" \
            --arg upstream "$GITEA_LINEAGE_VERSION" \
            --arg upstream_commit "$GITEA_LINEAGE_COMMIT" \
            --arg patch_revision "$PATCH_REVISION" \
            --arg platform "$TARGET_PLATFORM" \
            '{schema_version:1,release:$release,image:$image,digest:$digest,upstream_version:$upstream,upstream_commit:$upstream_commit,patch_revision:$patch_revision,platform:$platform}' \
            > release.json

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.publish.outputs.digest }}
          format: spdx-json
          output-file: forge.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          subject-version: ${{ env.RELEASE_TAG }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: forge.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          gh release create "$RELEASE_TAG" \
            release.json forge.spdx.json \
            --verify-tag \
            --title "Forge $RELEASE_TAG" \
            --notes "Rootless linux/amd64 image: \`$IMAGE_NAME@$IMAGE_DIGEST\`"
