name: Bug Report
description: Report unexpected Forge behavior.
labels: ["type/bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not disclose vulnerabilities or sensitive logs here. Follow `SECURITY.md` instead.
        Search existing issues before filing a duplicate.
  - type: input
    id: forge-version
    attributes:
      label: Forge version
      description: Provide the commit, release tag, container digest, or output of `./gitea --version`.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain what you did, what you expected, and what occurred. Include sanitized logs when relevant.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the installation method, operating system, database, and other relevant deployment details.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the problem.
    validations:
      required: true
