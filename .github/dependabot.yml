version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "07:23"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "07:23"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    allow:
      - dependency-type: direct
    groups:
      go-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "07:23"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    allow:
      - dependency-type: direct
    groups:
      frontend-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /contrib/workload-identity/image
    schedule:
      interval: monthly
      day: monday
      time: "07:23"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      image-bases:
        patterns: ["*"]
        update-types: [minor, patch]
    cooldown:
      default-days: 7
